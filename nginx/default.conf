# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name local.tile.music;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name local.tile.music;

    # SSL certificates
    ssl_certificate     /app/secrets/certs/local.tile.music.pem;
    ssl_certificate_key /app/secrets/certs/local.tile.music-key.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ----------------------------
    # Supabase OAuth routes
    # ----------------------------

    # /oauth/authorize → Supabase authorize
    location = /oauth/authorize {
        proxy_pass http://kong:8000/auth/v1/authorize;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Optional: disable buffering if Supabase responses are small
        proxy_buffering off;
    }

    # /oauth/callback → Supabase callback
    location = /oauth/callback {
        proxy_pass http://kong:8000/auth/v1/callback;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Supabase sets large cookies, increase buffers
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ----------------------------
    # Frontend / SvelteKit routes
    # ----------------------------
    location / {
        proxy_pass http://frontend:5173;

        proxy_http_version 1.1;

        # Disable buffering for redirects / OAuth headers
        proxy_buffering off;
        proxy_request_buffering off;

        # Increase header buffer size to handle large cookies
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support (Vite HMR / SvelteKit dev)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
